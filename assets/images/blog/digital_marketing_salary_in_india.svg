<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#090d16;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#10172a"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>

    <!-- Accent Glows -->
    <radialGradient id="indigoGlow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Glowing Orbs -->
  <circle cx="250" cy="180" r="380" fill="url(#indigoGlow)"/>
  <circle cx="950" cy="500" r="420" fill="url(#emeraldGlow)"/>

  <!-- Decorative Abstract Graph Lines -->
  <path d="M 120 520 Q 320 490 520 410 T 880 290 T 1100 180" fill="none" stroke="#4f46e5" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="6,6"/>
  <path d="M 120 540 Q 340 510 560 390 T 920 250 T 1100 140" fill="none" stroke="#10b981" stroke-width="3.5" stroke-opacity="0.6"/>

  <!-- Category & Intelligence Badge -->
  <g transform="translate(100, 90)">
    <rect width="360" height="38" rx="19" fill="#4f46e5" fill-opacity="0.18" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="6" fill="#10b981"/>
    <text x="38" y="24" fill="#a5b4fc" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">2026 SALARY &amp; CAREER REPORT</text>
  </g>

  <!-- Main Title -->
  <text x="100" y="195" fill="url(#textGrad)" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Digital Marketing Salary</text>
  <text x="100" y="260" fill="url(#textGrad)" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">in India: 2026 Guide</text>

  <!-- Subtitle Description -->
  <text x="100" y="315" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="19" font-weight="400">
    The Complete Compensation Breakdown: Freshers vs Specialists vs Leadership Roles
  </text>

  <!-- 3 Interactive Salary Highlight Cards -->
  <!-- Card 1: Fresher Tier -->
  <g transform="translate(100, 375)">
    <rect width="300" height="175" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <text x="24" y="38" fill="#64748b" font-family="'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="1">FRESHER / ENTRY (0-2 YRS)</text>
    <text x="24" y="85" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800">₹2.5 - 5.0 L</text>
    <text x="24" y="112" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Per Annum (₹20K - 40K / mo)</text>
    <rect x="24" y="132" width="130" height="24" rx="12" fill="#38bdf8" fill-opacity="0.12"/>
    <text x="36" y="148" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">Organic &amp; Social</text>
  </g>

  <!-- Card 2: Mid-Level Performance Tier (Highlighted) -->
  <g transform="translate(430, 360)">
    <rect width="320" height="195" rx="20" fill="#1e1b4b" fill-opacity="0.85" stroke="#6366f1" stroke-width="2"/>
    <rect x="24" y="18" width="150" height="22" rx="11" fill="#4f46e5"/>
    <text x="36" y="33" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" letter-spacing="1">HIGHEST DEMAND</text>
    <text x="24" y="68" fill="#a5b4fc" font-family="'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="1">PERFORMANCE &amp; GROWTH</text>
    <text x="24" y="112" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="800">₹8.0 - 16.0 L</text>
    <text x="24" y="140" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="13.5">ROAS, Paid Ads &amp; GA4 Tracking</text>
    <text x="24" y="166" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">3 - 6 Years Experience Tier</text>
  </g>

  <!-- Card 3: Senior Leadership Tier -->
  <g transform="translate(780, 375)">
    <rect width="320" height="175" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <text x="24" y="38" fill="#64748b" font-family="'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="1">HEAD OF GROWTH / VP (7+ YRS)</text>
    <text x="24" y="85" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800">₹18 - 28+ L</text>
    <text x="24" y="112" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Enterprise &amp; Brand Leadership</text>
    <rect x="24" y="132" width="155" height="24" rx="12" fill="#10b981" fill-opacity="0.12"/>
    <text x="36" y="148" fill="#10b981" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">Cross-Channel Strategy</text>
  </g>

  <!-- Footer Branding Row -->
  <g transform="translate(100, 605)">
    <text x="0" y="18" fill="#64748b" font-family="'Inter', sans-serif" font-size="13.5" font-weight="500">
      Author: <tspan fill="#e2e8f0" font-weight="700">Manjeet Singh Katare</tspan> • Digital Marketing &amp; Creative Strategy Specialist
    </text>
    <text x="1000" y="18" text-anchor="end" fill="#64748b" font-family="'Inter', sans-serif" font-size="13">
      manjeet-singh-katare.vercel.app
    </text>
  </g>
</svg>
