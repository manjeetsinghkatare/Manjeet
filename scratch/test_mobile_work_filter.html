<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body, html { margin:0; padding:0; height:100%; overflow:hidden; }
    iframe { width:100%; height:100%; border:none; }
  </style>
</head>
<body>
  <iframe id="app" src="../index.html"></iframe>
  <script>
    const iframe = document.getElementById('app');
    iframe.onload = () => {
      setTimeout(() => {
        const doc = iframe.contentDocument;
        const work = doc.getElementById('work');
        iframe.contentWindow.scrollTo(0, work.offsetTop);

        // Click Digital Marketing & SEO filter
        const dmBtn = doc.querySelector('.filter-btn[data-filter="digital-marketing"]');
        if (dmBtn) dmBtn.click();
      }, 400);
    };
  </script>
</body>
</html>
