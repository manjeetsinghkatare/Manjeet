<!DOCTYPE html>
<html>
<body>
<iframe id="f" src="../index.html" style="width:390px; height:844px; border:none;"></iframe>
<script>
window.onload = () => {
  const frame = document.getElementById('f');
  frame.onload = () => {
    setTimeout(() => {
      const work = frame.contentDocument.getElementById('work');
      work.scrollIntoView();
      document.title = 'SCROLLED';
    }, 500);
  };
};
</script>
</body>
</html>
